<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0c12">
<title>加一本書 · 我的圖書館</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="assets/style.css?v=6">
<script src="assets/app.js?v=6"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html">📜 我的圖書館</a>
  <nav class="tabs">
    <a href="index.html">🕯️ 書架</a>
    <a href="add.html">🪶 加一本書</a>
    <a href="backup.html">💾 備份</a>
    <a href="about.html">❓ 說明</a>
  </nav>
</div></header>
<main class="wrap">
  <h1 id="heading">加一本書</h1>
  <form id="form" class="card" novalidate>
    <div class="field">
      <label for="title">書名 <span class="req">*</span></label>
      <input id="title" required maxlength="200">
    </div>
    <div class="row">
      <div class="field">
        <label for="author">作者</label>
        <input id="author" maxlength="200">
      </div>
      <div class="field">
        <label for="category">分類</label>
        <input id="category" list="catList" maxlength="50" placeholder="例如：奇幻、小說、科普">
        <datalist id="catList"></datalist>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="status">閱讀狀態</label>
        <select id="status">
          <option value="want">🔮 想讀</option>
          <option value="reading">📖 正在讀</option>
          <option value="done">✨ 讀完了</option>
        </select>
      </div>
      <div class="field">
        <label>評分</label>
        <div class="star-pick" id="stars"></div>
      </div>
    </div>
    <div class="field">
      <label for="cover">封面圖片網址 <span class="muted" style="font-weight:400">（可不填，會自動做成皮革封面）</span></label>
      <input id="cover" type="url" placeholder="https://…/cover.jpg">
    </div>
    <div class="field">
      <label for="notes">心得 / 筆記</label>
      <textarea id="notes" rows="5" maxlength="5000"></textarea>
    </div>
    <p id="err" style="color:var(--wine);font-weight:900" hidden></p>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">🪶 放上書架</button>
      <a class="btn ghost" href="index.html" id="cancel">取消</a>
    </div>
  </form>

<script>
const $ = id => document.getElementById(id);
const editId = qs('id');
const books = loadBooks();
const editing = editId ? books.find(b => b.id === editId) : null;
let rating = 0;

$('catList').innerHTML = [...new Set(books.map(b => b.category).filter(Boolean))]
  .map(c => `<option value="${esc(c)}">`).join('');

function drawStars() {
  $('stars').innerHTML = [1, 2, 3, 4, 5].map(n =>
    `<button type="button" data-n="${n}" class="${n <= rating ? 'on' : ''}" aria-label="${n} 顆星">★</button>`).join('');
}
$('stars').addEventListener('click', e => {
  const n = Number(e.target.dataset.n);
  if (n) { rating = (rating === n) ? 0 : n; drawStars(); }
});

if (editId && !editing) {
  document.querySelector('main').innerHTML =
    '<div class="card empty"><div class="big">❓</div><p>找不到這本書。</p><a class="btn" href="index.html">回書架</a></div>';
} else {
  if (editing) {
    document.title = '編輯 · 我的圖書館';
    $('heading').textContent = '編輯：' + editing.title;
    $('saveBtn').textContent = '🪶 儲存修改';
    $('cancel').href = 'book.html?id=' + encodeURIComponent(editing.id);
    $('title').value = editing.title || '';
    $('author').value = editing.author || '';
    $('category').value = editing.category || '';
    $('status').value = editing.status || 'want';
    $('cover').value = editing.cover || '';
    $('notes').value = editing.notes || '';
    rating = editing.rating || 0;
  }
  drawStars();
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const err = msg => { $('err').textContent = msg; $('err').hidden = !msg; };
  const title = $('title').value.trim();
  if (!title) { err('請填書名喔！'); $('title').focus(); return; }
  const coverRaw = $('cover').value.trim();
  const cover = safeUrl(coverRaw);
  if (coverRaw && !cover) { err('封面圖片網址看起來不對。'); $('cover').focus(); return; }
  err('');

  const data = {
    title, author: $('author').value.trim(), category: $('category').value.trim(),
    status: $('status').value, rating, cover, notes: $('notes').value.trim()
  };
  let id;
  if (editing) { Object.assign(editing, data); delete editing.links; id = editing.id; }
  else { id = uid(); books.push({ id, added: Date.now(), ...data }); }
  if (saveBooks(books)) location.href = 'book.html?id=' + encodeURIComponent(id) + '&saved=' + (editing ? 2 : 1);
});
</script>
</main>
<footer>✦ 我的圖書館 ✦ 書的資料只存在你這台裝置的瀏覽器裡，記得常到「備份」頁存一份喔</footer>
</body>
</html>
